<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Meus Bolões - Bolões Aleatórios</title>
    <meta name="theme-color" content="#f5f5f7">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Mesmo visual premium do index (Rodada 47) — ver style-vitrine.css -->
    <link rel="stylesheet" href="style-vitrine.css">
    <style>
        /* Só o que é específico desta página — tokens, top-bar, card,
           botões e pills de status vêm de style-vitrine.css. */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .resultado-titulo {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--hairline);
        }

        .resultado-titulo .badge {
            font-size: 12px;
            font-weight: normal;
            color: var(--text-secondary);
        }

        /* Bug antigo corrigido de passagem: o selo ABERTO/EM ANDAMENTO/
           ENCERRADO de cada bolão (consulta.js) recebe a classe crua
           ("aberto"/"andamento"/"encerrado"), não "status-aberto" — só o
           cabeçalho de seção usava esse nome prefixado. Os dois casos
           precisam de seletor próprio. */
        .bolao-status.aberto, .status-aberto         { background: #d1f7db; color: #1a7431; }
        .bolao-status.andamento, .status-andamento   { background: #ffe8cc; color: #9a5b00; }
        .bolao-status.encerrado, .status-encerrado   { background: #ffd9d6; color: #c41e1a; }
        .bolao-status { margin-top: 6px; }

        .btn-ver-cartoes {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 14px;
            background: var(--accent);
            color: white;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .btn-ver-cartoes:hover { background: var(--accent-hover); }

        .secao-boloes { margin-top: 20px; }
        .secao-boloes .secao-titulo {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-md);
        }
        .secao-boloes .secao-titulo.aberto     { background: #d1f7db; color: #1a7431; }
        .secao-boloes .secao-titulo.andamento  { background: #ffe8cc; color: #9a5b00; }
        .secao-boloes .secao-titulo.encerrado  { background: #ffd9d6; color: #c41e1a; }

        @media (max-width: 480px) {
            .card-body { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="logo">🎲 Bolões Aleatórios</a>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                🔍 MEUS BOLÕES
                <div class="subtitle">Consulte os bolões que você participa</div>
            </div>
            <div class="card-body" id="conteudo">
                <!-- FORMULÁRIO DE CONSULTA -->
                <div id="formConsulta">
                    <div class="dica">
                        📌 Digite apenas os números do seu telefone com DDD.<br>
                        <strong>Exemplos:</strong>
                        <span class="exemplo">61999999999</span> (celular)
                        <span class="exemplo">2133333333</span> (fixo)
                    </div>
                    
                    <div class="form-group">
                        <label>📞 Seu telefone:</label>
                        <input type="tel" id="telefoneInput" class="input-telefone" 
                               placeholder="Ex: 61999999999" 
                               maxlength="11" 
                               inputmode="numeric">
                    </div>
                    
                    <button id="btnConsultar" class="btn-consultar">🔍 CONSULTAR MEUS BOLÕES</button>
                    
                    <a href="index.html" class="btn-voltar">⬅️ VOLTAR PARA O SITE</a>
                </div>

                <!-- RESULTADOS (oculto inicialmente) -->
                <div id="resultados" style="display: none;">
                    <div id="resultadoConteudo"></div>
                    <button id="btnNovaConsulta" class="btn-voltar" style="margin-top: 12px;">🔄 NOVA CONSULTA</button>
                    <a href="index.html" class="btn-voltar">⬅️ VOLTAR PARA O SITE</a>
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 Bolões Aleatórios - Consulta de Participação
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="consulta.js"></script>
</body>
</html>
