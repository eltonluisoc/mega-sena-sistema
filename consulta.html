<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bolões Aleatórios - Meus Bolões</title>
    <meta name="theme-color" content="#f5f5f7">
    <link rel="stylesheet" href="style.css">
    <!-- Mesmo visual premium do index (Rodada 47) — ver style-vitrine.css -->
    <link rel="stylesheet" href="style-vitrine.css">
    <style>
        /* Só o que é específico desta página — o resto vem de
           style-vitrine.css (tokens, top-bar, card, botões, pills de
           status). */
        .consulta-container { max-width: 700px; margin: 0 auto; padding: 20px; }
        .resultado-card { padding: 4px; }

        .bolao-item {
            background: #fbfbfd;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
        }
        .bolao-titulo {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .token-info {
            background: #f5f5f7;
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            text-align: center;
        }
        .participante-nome { font-size: 18px; font-weight: 700; color: var(--text); }
        .participante-telefone { font-size: 13px; color: var(--text-secondary); }
        .cotas-info { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="logo">🎲 Bolões Aleatórios</a>
    </div>

    <div class="consulta-container">
        <div class="card" style="text-align:center; padding: 24px 20px; margin-bottom: 20px;">
            <h1 style="margin:0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">🎲 MEUS BOLÕES</h1>
            <div style="color: var(--text-secondary); font-size: 14px; margin-top: 6px;">Acompanhe sua participação</div>
        </div>
        <div id="conteudo" class="card resultado-card">
            <div class="loading">🔍 Carregando suas informações...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // ============================================
        // FUNÇÃO PARA FORMATAR TELEFONE
        // ============================================
        function formatarTelefone(telefone) {
            if (!telefone) return '';
            const numeros = telefone.replace(/\D/g, '');
            if (numeros.length === 11) {
                return `(${numeros.substring(0, 2)}) ${numeros.substring(2, 7)}-${numeros.substring(7)}`;
            } else if (numeros.length === 10) {
                return `(${numeros.substring(0, 2)}) ${numeros.substring(2, 6)}-${numeros.substring(6)}`;
            }
            return numeros;
        }

        // ============================================
        // FUNÇÃO PARA NORMALIZAR TELEFONE (APENAS NÚMEROS)
        // ============================================
        function normalizarTelefone(telefone) {
            if (!telefone) return '';
            return telefone.replace(/\D/g, '');
        }

        // Escapa texto vindo do Firestore (título de bolão) antes de
        // inserir em innerHTML — essa página é pública, sem login.
        function escapeHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto ?? '';
            return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ============================================
        // CARREGAR DADOS DO PARTICIPANTE
        // ============================================
        async function carregarDados() {
            const container = document.getElementById('conteudo');
            
            // Obter token da URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                container.innerHTML = `
                    <div style="text-align:center;">
                        <h3>⚠️ Link inválido</h3>
                        <p>Entre em contato com o administrador para receber seu link de acesso pessoal.</p>
                        <button class="btn-voltar" onclick="window.location.href='index.html'">🏠 VOLTAR PARA O SITE</button>
                    </div>
                `;
                return;
            }
            
            try {
                // Verificar token
                const tokenDoc = await db.collection('participantes_tokens').doc(token).get();
                
                if (!tokenDoc.exists || tokenDoc.data().ativo !== true) {
                    container.innerHTML = `
                        <div style="text-align:center;">
                            <h3>🔒 Acesso expirado ou revogado</h3>
                            <p>Seu link de acesso foi desativado. Entre em contato com o administrador para reativar.</p>
                            <button class="btn-voltar" onclick="window.location.href='index.html'">🏠 VOLTAR PARA O SITE</button>
                        </div>
                    `;
                    return;
                }
                
                const participante = tokenDoc.data();
                const telefoneOriginal = participante.telefone || '';
                const telefoneNormalizado = normalizarTelefone(telefoneOriginal);
                const nome = participante.nome || 'Participante';
                const telefoneFormatado = formatarTelefone(telefoneOriginal);
                
                console.log('🔍 Buscando bolões para:', nome, 'telefone:', telefoneNormalizado);
                
                // ============================================
                // BUSCAR STATUS DO CONFIG_BOLOES/ATIVOS
                // ============================================
                const configDoc = await db.collection('config_boloes').doc('ativos').get();
                const statusMap = configDoc.exists ? configDoc.data().status || {} : {};
                console.log('📋 Status Map do config_boloes:', statusMap);
                
                // Buscar todos os bolões
                const boloesSnapshot = await db.collection('participantes').get();
                const boloes = [];
                boloesSnapshot.forEach(doc => {
                    boloes.push({ id: doc.id, ...doc.data() });
                });
                
                console.log(`📋 Total de bolões encontrados: ${boloes.length}`);
                
                // Separar bolões
                const participa = [];
                const naoParticipa = [];
                const encerrados = [];

                for (const bolao of boloes) {
                    const participantes = bolao.participantes || [];
                    
                    // USAR O STATUS DO STATUS_MAP (do config_boloes)
                    const statusBolao = statusMap[bolao.id] || 'andamento';
                    
                    console.log(`🔍 Bolão: ${bolao.titulo} - Status do config: ${statusBolao}`);
                    
                    // NORMALIZAR TELEFONE PARA COMPARAÇÃO
                    const encontrado = participantes.find(p => {
                        const telefoneParticipante = p.telefone ? normalizarTelefone(p.telefone) : '';
                        return telefoneParticipante === telefoneNormalizado;
                    });
                    
                    if (encontrado) {
                        console.log(`✅ Participa do bolão: ${bolao.titulo} (${statusBolao})`);
                        participa.push({
                            ...bolao,
                            meuStatus: encontrado.situacao,
                            minhasCotas: encontrado.quantidadeCotas || 1,
                            meuValorPago: encontrado.valorPago,
                            meuNome: encontrado.nome
                        });
                    } else if (statusBolao === 'aberto') {
                        console.log(`🔵 Não participa do bolão ABERTO: ${bolao.titulo}`);
                        naoParticipa.push(bolao);
                    } else if (statusBolao === 'encerrado') {
                        console.log(`🔴 Bolão ENCERRADO: ${bolao.titulo}`);
                        encerrados.push(bolao);
                    } else {
                        console.log(`🟡 Bolão EM ANDAMENTO (não participa): ${bolao.titulo}`);
                    }
                }

                // ============================================
                // REMOVER DUPLICADOS NA EXIBIÇÃO
                // ============================================
                const participaUnicos = [];
                const idsVistos = new Set();
                for (const bolao of participa) {
                    if (!idsVistos.has(bolao.id)) {
                        idsVistos.add(bolao.id);
                        participaUnicos.push(bolao);
                    }
                }

                const naoParticipaUnicos = [];
                const idsVistosNao = new Set();
                for (const bolao of naoParticipa) {
                    if (!idsVistosNao.has(bolao.id)) {
                        idsVistosNao.add(bolao.id);
                        naoParticipaUnicos.push(bolao);
                    }
                }

                // ORDENAR BOLÕES EM ORDEM ALFABÉTICA
                participaUnicos.sort((a, b) => a.titulo.localeCompare(b.titulo));
                naoParticipaUnicos.sort((a, b) => a.titulo.localeCompare(b.titulo));

                console.log(`📊 Resumo: Participa=${participaUnicos.length}, Abertos=${naoParticipaUnicos.length}, Encerrados=${encerrados.length}`);
                
                // Montar HTML
                let html = `
                    <div class="token-info">
                        <div class="participante-nome">👤 ${nome}</div>
                        <div class="participante-telefone">📞 ${telefoneFormatado}</div>
                    </div>
                `;
                
                // Bolões que participa
                if (participaUnicos.length > 0) {
                    html += `<h3 style="margin-bottom: 12px;">✅ BOLÕES QUE VOCÊ PARTICIPA</h3>`;
                    for (const bolao of participaUnicos) {
                        const statusText = (bolao.meuStatus === 'quitado' || bolao.meuStatus === 'pago') ? 'PAGO' : 'EM ANDAMENTO';
                        const statusClass = (bolao.meuStatus === 'quitado' || bolao.meuStatus === 'pago') ? 'status-pago' : 'status-pendente';
                        // USAR O STATUS DO STATUS_MAP
                        const statusBolaoReal = statusMap[bolao.id] || 'andamento';
                        const statusBolaoClass = statusBolaoReal === 'aberto' ? 'status-aberto' : 'status-andamento';
                        const statusBolaoText = statusBolaoReal === 'aberto' ? 'ABERTO' : 'EM ANDAMENTO';
                        
                        html += `
                            <div class="bolao-item">
                                <div class="bolao-titulo">
                                    <span>🎯 ${escapeHtml(bolao.titulo)}</span>
                                    <span class="bolao-status ${statusBolaoClass}">${statusBolaoText}</span>
                                </div>
                                <div style="font-size: 13px; margin-top: 5px;">💰 R$ ${(bolao.valorPorCota || 0).toFixed(2).replace('.', ',')} / cota</div>
                                <div class="cotas-info">🎟️ ${bolao.minhasCotas} cota(s) | 💵 Valor Pago: R$ ${(bolao.meuValorPago || 0).toFixed(2).replace('.', ',')}</div>
                                <div style="margin-top: 8px;">
                                    <span class="${statusClass}">${statusText}</span>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    html += `<div class="bolao-item" style="text-align:center;">📭 Você ainda não participa de nenhum bolão.</div>`;
                }
                
                // Bolões abertos que não participa
                if (naoParticipaUnicos.length > 0) {
                    html += `<h3 style="margin-top: 24px; margin-bottom: 12px;">🔵 BOLÕES ABERTOS PARA PARTICIPAR</h3>`;
                    for (const bolao of naoParticipaUnicos) {
                        html += `
                            <div class="bolao-item">
                                <div class="bolao-titulo">
                                    <span>🎯 ${escapeHtml(bolao.titulo)}</span>
                                    <span class="bolao-status status-aberto">ABERTO</span>
                                </div>
                                <div style="font-size: 13px; margin-top: 5px;">💰 R$ ${(bolao.valorPorCota || 0).toFixed(2).replace('.', ',')} / cota</div>
                                <div style="font-size: 12px; color: #64748b; margin-top: 4px;">📅 Concurso ${bolao.concurso || '---'}</div>
                                <button class="btn-participar" data-bolao="${escapeHtml(bolao.titulo)}" data-telefone="${escapeHtml(telefoneOriginal)}" data-nome="${escapeHtml(nome)}">📝 QUERO PARTICIPAR</button>
                            </div>
                        `;
                    }
                }
                
                if (encerrados.length > 0 && participaUnicos.length === 0 && naoParticipaUnicos.length === 0) {
                    html += `<div class="aviso" style="margin-top: 16px;">📭 No momento não há bolões abertos para participar.</div>`;
                }
                
                html += `<div class="aviso">⚠️ Bolões com status "EM ANDAMENTO" já ocorreram e não aceitam novas inscrições.</div>`;
                html += `<div style="text-align: center; margin-top: 16px;">
                            <button class="btn-voltar" onclick="window.location.href='index.html'">🏠 VOLTAR PARA O SITE</button>
                        </div>`;
                
                container.innerHTML = html;
                
                // Eventos dos botões "QUERO PARTICIPAR"
                document.querySelectorAll('.btn-participar').forEach(btn => {
                    btn.onclick = () => {
                        const bolaoTitulo = btn.dataset.bolao;
                        const telefoneUser = btn.dataset.telefone;
                        const nomeUser = btn.dataset.nome;
                        const telefoneLimpo = normalizarTelefone(telefoneUser);
                        const msg = `Olá! Gostaria de participar do bolão "${bolaoTitulo}". Meu nome: ${nomeUser}, Telefone: ${telefoneLimpo}`;
                        window.open(`https://wa.me/5561998507770?text=${encodeURIComponent(msg)}`, '_blank');
                    };
                });
                
            } catch (error) {
                console.error('Erro:', error);
                container.innerHTML = `
                    <div style="text-align:center;">
                        <h3>❌ Erro ao carregar dados</h3>
                        <p>Tente novamente mais tarde.</p>
                        <button class="btn-voltar" onclick="window.location.href='index.html'">🏠 VOLTAR PARA O SITE</button>
                    </div>
                `;
            }
        }
        
        // Iniciar
        carregarDados();
    </script>
</body>
</html>
